# SPDX-License-Identifier: Apache-2.0
name: repo hygiene
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  hygiene:
    name: private material, licences and notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: source, notices and documentation
        run: |
          python tools/test_public_scan.py
          python tools/check_public.py --history
          python tools/check_license.py
          python tools/check_docs.py
      - name: full corpus integrity
        run: |
          python -m pip install -r tools/requirements.txt
          python tools/corpora/unpack.py --verify-only
          python tools/corpora/emit_history_yaml.py --check
      - name: secret scan of tree, archives and complete history
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks dir . --no-banner --redact --max-archive-depth 3 --max-decode-depth 3
          /tmp/gitleaks git . --no-banner --redact --max-decode-depth 3 --log-opts="--all"
