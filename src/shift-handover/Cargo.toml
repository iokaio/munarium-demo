# SPDX-License-Identifier: Apache-2.0
[package]
name = "shift-handover"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
munarium-client = { path = "/opt/munarium/clients/rust/munarium-client" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
axum = "0.8"
