# SPDX-License-Identifier: Apache-2.0
# demo-anthropic — a Claude-family provider config for a front end that
# lets users choose a model family.
#
# A front end maps its "Claude" family choice to
# `model_override: { provider: demo-anthropic, tier: fast|capable|frontier }`
# on each session turn; the explicit Fast model and built-in tiers resolve
# fast -> claude-haiku-5-5, capable -> claude-sonnet-5 and
# frontier -> claude-fable-5-1. A runbook lists this config in
# `models.allowOverrides`. The credential is the same env var the synthesized
# default uses — this config exists so the override policy can name a family
# explicitly, not to change credentials.
#
# The rpm budget is a guard: a public-facing front end should never be able
# to saturate a shared key. The dailyTokens ceilings are the spending caps:
# per-tier daily token budgets, UTC-day window, enforced in op_complete
# against the shared ledger (migration 0029). A tier without a value is
# unlimited. Size the frontier tier from its measured per-turn cost: on a
# hard multi-document question a frontier model's turns measured roughly 3x
# a capable model's tokens, so the same ceiling buys a third of the
# questions.
#
#   mmctl apply -f runbooks/providers/demo-anthropic.yaml
apiVersion: munarium.ioka.io/v1
kind: ProviderConfig
metadata: { name: demo-anthropic }
spec:
  provider: anthropic
  models:
    fast: claude-haiku-5-5
  # Pin current effort; calibrate quality and token use before lowering it.
  # Requires Server Claude policy support; older binaries ignore this block.
  anthropic:
    models:
      claude-sonnet-5: { effort: high, thinking: adaptive }
      claude-fable-5-1: { effort: high }
  credentialRef: { env: MUNARIUM_SECRET_ANTHROPIC }
  budgets:
    rpm: 30
    dailyTokens: { fast: 1000000, capable: 500000, frontier: 250000 }  # placeholders: size to your own keys
